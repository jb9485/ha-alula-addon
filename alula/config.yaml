name: Alula BAT-Connect
version: "0.3.1"
slug: alula
description: >
  Bridge an Alula BAT-Connect (DSC PowerSeries) alarm panel to Home Assistant
  over MQTT. Uses the same Alula cloud API as the Alula Security mobile app.
url: https://github.com/jb9485/ha-alula-addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
services:
  - mqtt:need
options:
  username: ""
  password: ""
  code: ""
  poll_interval: 30
  level_home: 0
  level_away: 0
  level_night: 0
  stay_instant: false
  night_instant: true
  prompt_timeout: 60
  notify_services: ""
  device_name: Alula Alarm
  log_level: info
schema:
  username: str
  password: password
  code: password
  poll_interval: int(10,300)
  level_home: int(0,8)
  level_away: int(0,8)
  level_night: int(0,8)
  stay_instant: bool
  night_instant: bool
  prompt_timeout: int(15,300)
  notify_services: str?
  device_name: str
  log_level: list(debug|info|warning|error)
